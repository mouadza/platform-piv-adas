name: CI/CD Validation Platform

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-ci:
    name: Backend - tests Django
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-secret-key"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      SQLITE_NAME: "ci.sqlite3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Unit tests with coverage
        run: |
          python -m coverage erase
          python -m coverage run manage.py test admin_config.tests
          python -m coverage xml -o coverage.xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/coverage.xml
          if-no-files-found: error

  frontend-ci:
    name: Frontend - lint, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/lcov.info
          if-no-files-found: error

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          if-no-files-found: error

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: Backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Skip SonarQube when secrets are absent
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SonarQube skipped. Add SONAR_TOKEN and SONAR_HOST_URL repository secrets to enable this job."

  docker-build:
    name: Docker - build images
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false
          tags: validation-platform-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: false
          build-args: |
            VITE_API_URL=/
          tags: validation-platform-frontend:ci

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - sonar
      - docker-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Skip deploy when secrets are absent
        if: ${{ env.DEPLOY_HOST == '' || env.DEPLOY_USER == '' || env.DEPLOY_SSH_KEY == '' }}
        run: echo "Deployment skipped. Add DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY repository secrets to enable production deploy."

      - name: Deploy with SSH and Docker Compose
        if: ${{ env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          remote_path="${DEPLOY_PATH:-/opt/validation-platform}"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$remote_path' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git pull --ff-only
          docker compose -f docker-compose.aws.yml up -d --build
          docker compose -f docker-compose.aws.yml exec -T backend python manage.py migrate --noinput
          docker compose -f docker-compose.aws.yml ps
          EOF
