sonar.projectKey=validation-platform
sonar.projectName=Validation Platform
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Backend Django only
sonar.sources=Backend/validation_core
sonar.tests=Backend/validation_core/tests
sonar.test.inclusions=Backend/validation_core/tests/**/*.py

# Files that are not application source code
sonar.exclusions=\
  Backend/validation_core/tests/**,\
  Backend/validation_core/migrations/**,\
  Backend/validation_core/**/__pycache__/**

# Files intentionally excluded from the backend coverage calculation
sonar.coverage.exclusions=\
  Backend/validation_core/admin.py,\
  Backend/validation_core/apps.py,\
  Backend/validation_core/migrations/**,\
  Backend/validation_core/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=Backend/coverage.xml
