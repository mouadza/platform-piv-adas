services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "validation"
      RABBITMQ_DEFAULT_PASS: "validation_rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],backend"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DB_ENGINE: "postgresql"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_SSLMODE: "disable"
      MEDIA_ROOT: "gammes"
      STATIC_ROOT: "staticfiles"
      CELERY_BROKER_URL: "amqp://validation:validation_rabbitmq@rabbitmq:5672//"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      REDIS_CACHE_URL: "redis://redis:6379/2"
      CELERY_EMAIL_ASYNC: "false"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/gammes
      - backend_static:/app/staticfiles

  celery:
    build:
      context: ./Backend
    command: celery -A validationplateform worker -l info
    env_file:
      - ./Backend/.env
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],backend"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DB_ENGINE: "postgresql"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_SSLMODE: "disable"
      MEDIA_ROOT: "gammes"
      STATIC_ROOT: "staticfiles"
      CELERY_BROKER_URL: "amqp://validation:validation_rabbitmq@rabbitmq:5672//"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      REDIS_CACHE_URL: "redis://redis:6379/2"
      CELERY_EMAIL_ASYNC: "false"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_media:/app/gammes
      - backend_static:/app/staticfiles

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: "/"
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - backend_media:/media:ro

volumes:
  postgres_data:
  # Conserved so an existing SQLite volume is not removed accidentally.
  backend_db:
  backend_media:
  backend_static:
  rabbitmq_data:
