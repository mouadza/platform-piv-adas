services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: validation_app
      POSTGRES_USER: validation_app
      POSTGRES_PASSWORD: validation_app_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation_app -d validation_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENGINE: "postgresql"
      DB_NAME: "validation_app"
      DB_USER: "validation_app"
      DB_PASSWORD: "validation_app_password"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_SSLMODE: "prefer"

volumes:
  postgres_data:
